    <!-- Whether this machine draws in software, asked before anything is
         painted. Every gradient, shadow, blur and blend on the page is a
         separate shader a software rasteriser has to build before it can draw
         the first frame, and together they hold that frame for seconds on a
         machine with no GPU, which is what PageSpeed measures on. The answer
         lands on the root element ahead of the first frame and the stylesheet
         paints flat off it. The pattern is the one src/lib/softwareRenderer.js
         tests the backdrops with. -->
    <script>
      ;(function () {
        try {

          var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl')
          if (!gl) return

          var renderer = info
            ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL)
            : gl.getParameter(gl.RENDERER)
          if (/swiftshader|llvmpipe|softpipe|software|basic render/i.test(String(renderer || '')))
            document.documentElement.setAttribute('data-gpu', 'software')
          var lose = gl.getExtension('WEBGL_lose_context')
          if (lose) lose.loseContext()
        } catch (e) {}
      })()

    <!-- The home hero photograph. It is the largest paint on the entry route
         and lives inside a lazy chunk, so without this the browser cannot start
         it until the bundle has downloaded, parsed and run. `imagesrcset` and
         `imagesizes` are the ones the element declares, so a phone preloads the
         phone-sized file and the element asks for the file that arrived. It is
         requested ahead of the faces below: they are the same priority, so the
         order they are written in is the order they are asked for, and text set
         in a fallback is on screen while the metric waits on this. -->
    <link
      rel="preload"
      as="image"
      fetchpriority="high"
      href="/brand/studio-portrait-dumbbells.webp"
      imagesrcset="/brand/studio-portrait-dumbbells-480.webp 480w, /brand/studio-portrait-dumbbells-800.webp 800w, /brand/studio-portrait-dumbbells-1200.webp 1200w, /brand/studio-portrait-dumbbells.webp 1600w"
      imagesizes="(min-width: 640px) 18rem, 15rem"
    />
